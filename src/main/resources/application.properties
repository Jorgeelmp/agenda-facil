spring.application.name=agendaFacil
spring.datasource.url=jdbc:postgresql://localhost:5432/agendaFacil
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


api.security.token.secret=${JWT_SECRET:agenda-facil-secret-key}

app.admin.email=${ADMIN_EMAIL:admin@agendafacil.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

app.seed.enabled=${SEED_ENABLED:true}
app.seed.password=${SEED_PASSWORD:Senha@123}
app.seed.clientes=${SEED_CLIENTES:80}
